[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fineval"
version = "0.1.0"
description = "FinEval: a reproducible benchmark for LLMs on XBRL, SEC filings and accounting"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["fineval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
